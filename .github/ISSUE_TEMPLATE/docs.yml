name: Documentation
description: README, API documentation or an example is missing something or is wrong.
labels: ["docs"]
body:
  - type: textarea
    id: missing
    attributes:
      label: What is missing or wrong
      description: README section, doc comment or example.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Where it cost time
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text or example
